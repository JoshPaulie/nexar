name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run python -m pytest tests -m "not slow"
      - name: Type check
        run: uv run ty check --error-on-warning
      - name: Check formatting
        run: uv run ruff format --check src tests docs
      - name: Lint
        run: uv run ruff check src tests docs
      - name: Reject one-dash snippet include markers
        run: |
          if grep -rqP '(?<!-)-8<--' docs/; then
            echo "Found one-dash -8<-- include markers; use --8<--."
            exit 1
          fi
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material pymdown-extensions "mkdocstrings[python]"
      - run: pip install .
      - run: mkdocs build --strict
  deploy:
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material pymdown-extensions "mkdocstrings[python]"
      - run: pip install "."
      - run: mkdocs gh-deploy --force
